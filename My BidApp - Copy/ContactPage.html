<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TheBid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <img src="logo.jpeg" alt="Logo" onerror="this.style.backgroundColor='#6366f1'">
        <a href="HomePage.html">Home</a>
        <a href="ShoppingPage.html">Shopping</a> 
        <a href="BiddingPage.html">Bid</a>
        <a href="ProfilePage.html">Profile</a>
        <a href="CartPage.html">Shopping Cart</a>
        <div class="cart-status">Cart: <span id="cart-count">0</span></div>
    </nav>

    <div class="container">
        <h1>Contact Us</h1>
        <div class="form-container">
            <form id="contact-form" onsubmit="handleContactSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" required placeholder="Order inquiry, feedback, etc.">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <div id="contact-feedback" class="feedback-msg"></div>
        </div>
    </div>

    <script src="TheBidApp.js"></script>
</body>
</html>
