<html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TheBid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <img src="logo.jpeg" alt="Logo" onerror="this.style.backgroundColor='#6366f1'">
        <a href="HomePage.html">Home</a>
        <a href="ShoppingPage.html">Shopping</a> 
        <a href="BiddingPage.html">Bid</a>
        <a href="ContactPage.html">Contact Us</a>
        <a href="CartPage.html">Shopping Cart</a>
        <a href="AboutPage.html">About</a>
        <div class="cart-status">Cart: <span id="cart-count">0</span></div>
    </nav>

    <div class="container">
        <h1>User Profile</h1>
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar">G</div>
                <div>
                    <h2 id="profile-username">GamerOne</h2>
                    <p class="card-meta" id="profile-email">gamerone@example.com</p>
                </div>
            </div>

            <div class="profile-section">
                <h3>Account Details</h3>
                <form id="profile-form" onsubmit="handleProfileUpdate(event)">
                    <div class="form-group">
                        <label for="username-input">Username</label>
                        <input type="text" id="username-input" value=" ">
                    </div>
                    <div class="form-group">
                        <label for="email-input">Email</label>
                        <input type="email" id="email-input" value="gamerone@example.com">
                    </div>
                    <button type="submit" class="btn">Save Changes</button>
                </form>
            </div>

            <div class="profile-section">
                <h3>Active Bids</h3>
                <div id="active-bids-list">
                    <p class="card-meta">No active bids placed yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="TheBidApp.js"></script>
</body>
</html>
